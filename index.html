<!DOCTYPE html>
<html>
<head>
    <title>welcome to html ordered and Unordered list</title>
</head>
<body style="background-color: lightyellow;">

    <h1 style="color: blue; text-align: center;">
        Welcome to HTML ol and ul list
    </h1>

    <p style="color: green; font-size: 18px;">
        HTML stands for HyperText Markup Language.
        It is used to create web pages.
    </p>

    <h2 style="color: red;">Unordered List</h2>

    <ul style="color: purple; font-size: 18px;">
        <li>Python</li>
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <h2 style="color: brown;">Ordered List</h2>

    <ol style="color: darkblue; font-size: 18px;">
        <li>Wake up</li>
        <li>Attend classes</li>
        <li>Complete homework</li>
        <li>Study</li>
    </ol>

</body>
</html>
